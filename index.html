<script>
(function(){
  const synth = window.speechSynthesis;
  const btns = document.querySelectorAll('.read-aloud');
  if(!synth){ btns.forEach(b=>b.hidden=true); }
  else {
    const LABEL='Leer en voz alta', STOP='Parar lectura';
    let voice=null, token=0, current=null;

    function score(v){
      const n=v.name.toLowerCase(), l=(v.lang||'').replace('_','-').toLowerCase();
      if(!l.startsWith('es')) return -1000;
      let s=0;
      if(l==='es-es') s+=3; else if(l==='es-mx'||l==='es-us') s+=2;
      if(/natural|neural|online/.test(n)) s+=10;
      if(/premium|enhanced|mejorada|ampliada/.test(n)) s+=8;
      if(/siri/.test(n)) s+=6;
      if(/google/.test(n)) s+=5;
      if(/mónica|monica|paulina|marisol|elvira|helena|laura|lucía|lucia|sabina|dalia/.test(n)) s+=3;
      if(/eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|albert|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph/.test(n)) s-=100;
      return s;
    }
    function pickVoice(){
      const vs=synth.getVoices(); if(!vs.length) return;
      const best=vs.map(v=>[score(v),v]).sort((a,b)=>b[0]-a[0])[0];
      voice = best[0]>0 ? best[1] : null;
    }
    pickVoice(); synth.onvoiceschanged=pickVoice;

    function setState(btn,on){
      btn.setAttribute('aria-pressed',on?'true':'false');
      btn.querySelector('span').textContent=on?STOP:LABEL;
    }
    function stopAll(){
      token++; synth.cancel();
      if(current){ setState(current,false); current=null; }
    }
    function speak(btn){
      const ch=document.getElementById(btn.dataset.target);
      const parts=[ch.querySelector('h2').textContent,
        ...[...ch.querySelectorAll('.text p, .chapter-end p')].map(p=>p.textContent)];
      const chunks=[];
      parts.forEach(p=>{
        const t=p.replace(/[—«»]/g,' ').replace(/\s+/g,' ').trim();
        (t.match(/[^.!?…]+[.!?…]*/g)||[t]).forEach(s=>{ s=s.trim(); if(s) chunks.push(s); });
      });
      const my=++token; let i=0; current=btn; setState(btn,true);
      (function next(){
        if(my!==token) return;
        if(i>=chunks.length){ setState(btn,false); current=null; return; }
        const u=new SpeechSynthesisUtterance(chunks[i++]);
        u.lang=voice?voice.lang:'es-ES';
        if(voice) u.voice=voice;
        u.rate=0.88; u.pitch=1;
        u.onend=next;
        u.onerror=()=>{ if(my===token){ setState(btn,false); current=null; } };
        synth.speak(u);
      })();
    }
    btns.forEach(btn=>{
      btn.addEventListener('click',()=>{
        const wasThis = current===btn;
        stopAll();
        if(!wasThis) speak(btn);
      });
    });
  }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.15});
  document.querySelectorAll('.page').forEach(p=>io.observe(p));
})();
</script>
